services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: linguicards
      POSTGRES_USER: linguicards
      POSTGRES_PASSWORD: linguicards
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://linguicards:linguicards@postgres:5432/linguicards
    restart: unless-stopped

volumes:
  postgres_data:
